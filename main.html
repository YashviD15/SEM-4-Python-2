<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beautiful Navbar</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #f0f2f5;
    }

    nav {
      background: linear-gradient(90deg, #4b6cb7, #182848);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 0.75rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav ul {
      display: flex;
      list-style: none;
      justify-content: flex-start;
      align-items: center;
      gap: 2rem;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      position: relative;
      padding: 0.5rem 0;
      transition: color 0.3s ease;
    }

    /* Underline effect on hover */
    nav ul li a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: #ffdd57;
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    nav ul li a:hover {
      color: #ffdd57;
    }

    nav ul li a:hover::after {
      width: 100%;
    }

    /* Optional: add a subtle scaling effect on hover */
    nav ul li a:hover {
      transform: scale(1.05);
      transition: transform 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="{% url "h"%}">Home</a></li>
      <li><a href="{% url "a"%}">About</a></li>
      <li><a href="{% url "s"%}">Services</a></li>
      <li><a href="{% url "c"%}">Contact</a></li>
    </ul>
  </nav>
  {% block content %}

  {% endblock %}
</body>
</html>
